services:
  - type: web
    name: xinsheng-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        value: "xinsheng-demo-fixed-key-2026"
      - key: AI_ENABLED
        value: "false"
      - key: CACHE_REPLAY
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: MAX_UPLOAD_MB
        value: "20"
